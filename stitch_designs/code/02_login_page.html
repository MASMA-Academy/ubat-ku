<style type="text/tailwindcss">

                font-weight: normal;
                font-style: normal;
                font-size: 24px;
                line-height: 1;
                letter-spacing: normal;
                text-transform: none;
                display: inline-block;
                white-space: nowrap;
                word-wrap: normal;
                direction: ltr;
                -webkit-font-feature-settings: 'liga';
                -webkit-font-smoothing: antialiased;
            }
            
            /* Ambient Shadows */

<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-container-margin">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-ambient p-section-padding space-y-8 animate-fade-in-up">
<!-- Header & Logo -->
<div class="text-center space-y-4">
<img alt="UbatKu Logo" class="w-24 h-24 mx-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFi7dP_lnxv1n7Kesa5yRAYtjMWMcM3s2q87eE8eq14BMUtpCxqIb8RJv_G1urNRmslfyxtmGpDZa79T0GQX_jSA2yod6D70mf03sU8J7P8Np2C3vgUIHwFWDm22ZcIBwlF3QKUhtDAUCyRT4LUl9Q1d14qO3PDfAYOfBbPYrs7ATDVJ-Hs9Ji-6s511FZSK3YcvdArENZj45UxOtTwTzReVTLbIUnuou_wAI9nQrPrx2dgXexKgNuNg"/>
<div>
<h1 class="font-display text-display text-primary">UbatKu</h1>
<p class="font-headline-md text-headline-md text-on-surface mt-2">Welcome back</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Please enter your details to sign in.</p>
</div>
</div>
<!-- Login Form -->
<form class="space-y-stack-gap">
<!-- Email Input -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md placeholder-outline min-h-[48px]" id="email" name="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface font-body-md placeholder-outline min-h-[48px]" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-lg hover:bg-primary-container transition-all duration-200 active:scale-[0.98] min-h-[48px] shadow-sm flex items-center justify-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-md text-body-md text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-inline-gap">
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors min-h-[48px]">
<!-- Google G Logo SVG snippet for demonstration (simulating icon) -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors min-h-[48px]">
<span class="material-symbols-outlined" data-icon="apple">file_download</span>
<span class="font-label-md text-label-md">Apple</span>
</button>
</div>
<!-- Sign Up Link -->
<p class="text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? <a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</main>
<script>
        // Simple input focus effects for better accessibility & feedback
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.previousElementSibling.classList.add('text-primary');
                this.previousElementSibling.classList.remove('text-outline');
            });
            input.addEventListener('blur', function() {
                this.previousElementSibling.classList.remove('text-primary');
                this.previousElementSibling.classList.add('text-outline');
            });
        });
    </script>
</body></html>
