<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UbatKu - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f8f9ff",
                        "outline": "#6c7a76",
                        "tertiary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "surface-container": "#e6eeff",
                        "on-background": "#121c2a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#dee9fc",
                        "on-secondary-container": "#007439",
                        "on-primary": "#ffffff",
                        "tertiary": "#005bc0",
                        "tertiary-fixed-dim": "#adc7ff",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#002c64",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#79f7e3",
                        "primary": "#006b5f",
                        "on-secondary-fixed": "#00210c",
                        "surface-bright": "#f8f9ff",
                        "tertiary-container": "#5694ff",
                        "primary-container": "#00a896",
                        "inverse-surface": "#27313f",
                        "on-primary-fixed": "#00201c",
                        "on-tertiary-fixed-variant": "#004493",
                        "on-primary-container": "#00352e",
                        "secondary-container": "#6dfe9c",
                        "on-primary-fixed-variant": "#005047",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary": "#006d36",
                        "surface-container-low": "#eff4ff",
                        "surface-tint": "#006b5f",
                        "surface-dim": "#d0dbed",
                        "on-surface": "#121c2a",
                        "primary-fixed-dim": "#59dbc7",
                        "surface-container-highest": "#d9e3f6",
                        "on-surface-variant": "#3c4946",
                        "surface-variant": "#d9e3f6",
                        "secondary-fixed": "#6dfe9c",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bbcac5",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#001a41",
                        "on-secondary-fixed-variant": "#005227",
                        "secondary-fixed-dim": "#4de082",
                        "inverse-primary": "#59dbc7",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inline-gap": "12px",
                        "section-padding": "24px",
                        "container-margin": "20px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "display": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased pb-24">
<!-- TopAppBar from JSON -->
<header class="full-width top-0 sticky shadow-sm bg-surface z-40">
<div class="flex justify-between items-center px-section-padding py-4 w-full">
<div class="flex items-center gap-inline-gap">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="medication" data-weight="fill" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<h1 class="font-display text-display text-primary">UbatKu</h1>
</div>
<button aria-label="Notifications" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="px-container-margin pt-6 max-w-4xl mx-auto">
<!-- Dashboard Header & Progress Ring -->
<section class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Today's Schedule</h2>
<p class="font-body-md text-on-surface-variant mb-6">You are doing great! 1 of 3 taken.</p>
<div class="glass-card rounded-xl p-6 flex items-center justify-between shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
<div>
<h3 class="font-label-lg text-label-lg text-primary mb-1">Daily Adherence</h3>
<p class="font-body-sm text-outline">Keep it up!</p>
</div>
<div class="relative w-16 h-16">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-surface-variant" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4"></path>
<path class="text-secondary-container" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="33, 100" stroke-width="4"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center font-label-lg text-label-lg text-primary">
                        33%
                    </div>
</div>
</div>
</section>
<!-- Medication List -->
<section class="flex flex-col gap-stack-gap">
<!-- Medication Card: Taken (Morning) -->
<article class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden relative border-l-8 border-secondary-fixed-dim transition-transform hover:-translate-y-1">
<div class="p-4 flex items-center justify-between min-h-[80px]">
<div class="flex flex-col">
<span class="inline-block px-3 py-1 rounded-full bg-surface-container-high font-label-md text-label-md text-on-surface-variant w-fit mb-2">Morning</span>
<h3 class="font-headline-md text-headline-md text-on-surface line-through opacity-70">Vitamin C</h3>
<p class="font-body-md text-outline">1 Tablet • 8:00 AM</p>
</div>
<div class="w-12 h-12 rounded-full bg-[#E6F6F4] flex items-center justify-center text-primary cursor-default">
<span class="material-symbols-outlined" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</article>
<!-- Medication Card: Upcoming (Afternoon) -->
<article class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.08)] overflow-hidden relative border-l-8 border-primary transition-transform hover:-translate-y-1 transform scale-100 z-10 ring-2 ring-primary/20">
<div class="p-4 flex items-center justify-between min-h-[80px]">
<div class="flex flex-col">
<span class="inline-block px-3 py-1 rounded-full bg-primary-container font-label-md text-label-md text-on-primary-container w-fit mb-2">Next Dose</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Panadol</h3>
<p class="font-body-md text-outline">2 Tablets • 12:00 PM</p>
</div>
<button aria-label="Mark Panadol as taken" class="w-12 h-12 rounded-full border-2 border-outline-variant flex items-center justify-center text-outline-variant hover:border-primary hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
</div>
</article>
<!-- Medication Card: Upcoming (Evening) -->
<article class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden relative border-l-8 border-outline-variant transition-transform hover:-translate-y-1">
<div class="p-4 flex items-center justify-between min-h-[80px]">
<div class="flex flex-col">
<span class="inline-block px-3 py-1 rounded-full bg-surface-container font-label-md text-label-md text-on-surface-variant w-fit mb-2">Evening</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Aspirin</h3>
<p class="font-body-md text-outline">1 Tablet • 8:00 PM</p>
</div>
<button aria-label="Mark Aspirin as taken" class="w-12 h-12 rounded-full border-2 border-outline-variant flex items-center justify-center text-outline-variant hover:border-primary hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
</div>
</article>
</section>
</main>
<!-- Floating Action Button -->
<button aria-label="Quick Add Medication" class="fixed bottom-24 right-4 md:right-8 w-14 h-14 bg-primary text-on-primary rounded-2xl shadow-lg flex items-center justify-center hover:bg-surface-tint hover:shadow-xl active:scale-95 transition-all z-40">
<span class="material-symbols-outlined text-[28px]" data-icon="add">add</span>
</button>
<!-- BottomNavBar from JSON -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.05)] shadow-lg flex justify-around items-center px-4 py-3 pb-safe">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:bg-surface-container-high active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Add -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle">add_circle</span>
<span class="font-label-md text-label-md">Add</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
</body></html>
