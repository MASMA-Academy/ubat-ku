<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>UbatKu - Medication History</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f8f9ff",
                        "outline": "#6c7a76",
                        "tertiary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "surface-container": "#e6eeff",
                        "on-background": "#121c2a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#dee9fc",
                        "on-secondary-container": "#007439",
                        "on-primary": "#ffffff",
                        "tertiary": "#005bc0",
                        "tertiary-fixed-dim": "#adc7ff",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#002c64",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#79f7e3",
                        "primary": "#006b5f",
                        "on-secondary-fixed": "#00210c",
                        "surface-bright": "#f8f9ff",
                        "tertiary-container": "#5694ff",
                        "primary-container": "#00a896",
                        "inverse-surface": "#27313f",
                        "on-primary-fixed": "#00201c",
                        "on-tertiary-fixed-variant": "#004493",
                        "on-primary-container": "#00352e",
                        "secondary-container": "#6dfe9c",
                        "on-primary-fixed-variant": "#005047",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary": "#006d36",
                        "surface-container-low": "#eff4ff",
                        "surface-tint": "#006b5f",
                        "surface-dim": "#d0dbed",
                        "on-surface": "#121c2a",
                        "primary-fixed-dim": "#59dbc7",
                        "surface-container-highest": "#d9e3f6",
                        "on-surface-variant": "#3c4946",
                        "surface-variant": "#d9e3f6",
                        "secondary-fixed": "#6dfe9c",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bbcac5",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#001a41",
                        "on-secondary-fixed-variant": "#005227",
                        "secondary-fixed-dim": "#4de082",
                        "inverse-primary": "#59dbc7",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inline-gap": "12px",
                        "section-padding": "24px",
                        "container-margin": "20px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "display": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col pb-[80px]">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary-fixed-dim font-headline-md text-headline-md full-width top-0 sticky shadow-sm flex justify-between items-center px-section-padding py-4 w-full z-40">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A stylized, flat vector illustration of a medical pill capsule with a small analog clock face overlaid on it. The color palette is clinical and clean, primarily using deep teal and white to represent trust and health in a modern mobile app context. The icon is simple, geometric, and designed for clarity." src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
</div>
<span class="font-display text-display text-primary dark:text-primary-fixed-dim">UbatKu</span>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-high active:scale-95 transition-transform text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow px-container-margin py-6 flex flex-col gap-stack-gap">
<!-- Page Title & Search/Filter -->
<div class="flex flex-col gap-4 mb-2">
<h1 class="font-headline-lg text-headline-lg">History</h1>
<div class="flex gap-2">
<div class="relative flex-grow">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Search medication..." type="text">
</div>
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg px-4 flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">filter_list</span>
</button>
</div>
<!-- Filter Chips -->
<div class="flex gap-2 mt-2 overflow-x-auto pb-2 scrollbar-hide">
<button class="px-4 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg whitespace-nowrap">All</button>
<button class="px-4 py-1.5 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-low">Taken</button>
<button class="px-4 py-1.5 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-low">Missed</button>
</div>
</div>
<!-- History List -->
<div class="flex flex-col gap-6">
<!-- Date Group: Today -->
<div class="flex flex-col gap-3">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Today, Oct 25</h2>
<div class="flex flex-col gap-3">
<!-- Medication Card: Taken -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border-l-4 border-primary flex items-center justify-between">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-on-surface">Lisinopril</span>
<div class="flex items-center gap-2 text-on-surface-variant text-body-md">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="">08:00 AM</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="">10mg Tablet</span>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-[#E6F6F4] flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</div>
</div>
<!-- Medication Card: Missed -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border-l-4 border-error flex items-center justify-between">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-on-surface">Metformin</span>
<div class="flex items-center gap-2 text-on-surface-variant text-body-md">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="">12:00 PM</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="">500mg Tablet</span>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-error">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">cancel</span>
</div>
</div>
</div>
</div>
<!-- Date Group: Yesterday -->
<div class="flex flex-col gap-3">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Yesterday, Oct 24</h2>
<div class="flex flex-col gap-3">
<!-- Medication Card: Taken -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border-l-4 border-primary flex items-center justify-between">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-on-surface">Atorvastatin</span>
<div class="flex items-center gap-2 text-on-surface-variant text-body-md">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="">09:00 PM</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="">20mg Tablet</span>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-[#E6F6F4] flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest dark:bg-inverse-surface shadow-[0_-4px_20px_rgba(0,0,0,0.05)] md:hidden">
<div class="flex justify-around items-center px-4 py-3">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-high active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-high active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1">add_circle</span>
<span class="font-label-md text-label-md">Add</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-xl px-6 py-1.5 hover:bg-primary-container/90 active:scale-95 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined mb-1 scale-110">history</span>
<span class="font-label-md text-label-md">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-high active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</div>
</nav>


</body></html>
